# langfuse-ingress.yaml
# Scope: langfuse.teamleaseregtech.com only (namespace: production)
# Apply: kubectl apply -f langfuse-ingress.yaml
#
# Stage 1 (now):  Content-Security-Policy-Report-Only  -> browser reports, nothing enforced
# Stage 2 (after console check): rename the key below to Content-Security-Policy and re-apply
# Revert: remove the custom-headers annotation from the Ingress and re-apply

apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-headers
  namespace: production
data:
  Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://langfuse.teamleaseregtech.com https://*.blob.core.windows.net; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/custom-headers: production/langfuse-headers
spec:
  ingressClassName: nginx
  rules:
    - host: langfuse.teamleaseregtech.com
      http:
        paths:
          - path: /api/health
            pathType: Exact
            backend:
              service:
                name: langfuse-worker
                port:
                  number: 3030

          - path: /api/public
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port:
                  number: 80
