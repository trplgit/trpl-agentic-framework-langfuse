apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:4.86.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: LANGFUSE_PRODUCTION
              value: "true"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: LANGFUSE_INIT_DATABASE
              value: "true"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: langfuse-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          # Startup runs DB migrations, so allow up to 5 minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
