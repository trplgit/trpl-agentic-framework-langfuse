apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langfuse-worker
          image: langfuse/langfuse-worker:4.86.0
          ports:
            - containerPort: 3030
          env:
            - name: NODE_ENV
              value: "production"
            - name: LANGFUSE_PRODUCTION
              value: "true"
            - name: LANGFUSE_CLICKHOUSE_MIGRATE
              value: "true"
          envFrom:
            - secretRef:
                name: langfuse-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 15
      imagePullSecrets:
        - name: acr-pull-secret
