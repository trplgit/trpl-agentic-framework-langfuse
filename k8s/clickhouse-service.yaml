apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: production
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: production
spec:
  serviceName: "clickhouse"
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      automountServiceAccountToken: false
      # Run as the image's built-in clickhouse user (101) instead of root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # ClickHouse 26.11.2.4: the exact image running in production on 2026-11-26
          # (was :latest). The digest keeps pod restarts from silently changing it;
          # upgrade by changing both the tag and the digest.
          image: clickhouse/clickhouse-server:26.11.2.4@sha256:7175c09031a599d17b43046abe3c79a70bd4263f77e4a8991286b4fc4886b1b0
          ports:
            - containerPort: 8123
            - containerPort: 9000
          # Credentials come from the langfuse-env secret managed in AKS
          # (same keys Langfuse web/worker use), not from this file.
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-env
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-env
                  key: CLICKHOUSE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Only Langfuse web and worker may reach ClickHouse (HTTP 8123, native 9000).
# Without this, any pod in the cluster can connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-allow-langfuse
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["langfuse-web", "langfuse-worker"]
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
